const products=[{id:'wallet',name:'Classic Bifold',price:1490,category:'Wallets',colour:'Brown',stock:true,rating:'4.8 (124)',tags:'leather wallet slim bifold brown full grain'},{id:'belt',name:'Heritage Belt',price:1790,category:'Belts',colour:'Brown',stock:true,rating:'4.7 (86)',tags:'leather belt brown full grain'},{id:'bag',name:'Everyday Satchel',price:4990,category:'Bags',colour:'Brown',stock:true,rating:'4.9 (32)',tags:'leather bag work satchel brown full grain'},{id:'card',name:'Slim Card Holder',price:890,category:'Wallets',colour:'Brown',stock:true,rating:'4.6 (51)',tags:'leather wallet card holder slim brown full grain'}];
const fresh=()=>({category:'All',colour:'All',min:'',max:'',stock:false,sort:'featured'});
let page='search',recent=['leather wallet','brown belt','work bag'],filters=fresh(),draft=fresh(),saved=new Set(),preview='normal',correction='';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function matching(f=filters){if(!valid(f))return [];const q=queryText(),tokens=q.split(' ').filter(Boolean);let a=products.filter(p=>tokens.every(k=>(p.name+' '+p.category+' '+p.tags).toLowerCase().includes(k))&&(f.category==='All'||f.category===p.category)&&(f.colour==='All'||f.colour===p.colour)&&(!f.stock||p.stock)&&(f.min===''||p.price>=Number(f.min))&&(f.max===''||p.price<=Number(f.max)));if(f.sort==='priceAsc')a.sort((a,b)=>a.price-b.price);if(f.sort==='priceDesc')a.sort((a,b)=>b.price-a.price);if(f.sort==='name')a.sort((a,b)=>a.name.localeCompare(b.name));return a}

 }else if(page==='filters'){

 $('sort').value=draft.sort;$('apply').innerHTML='<div class="apply"><button class="primary" id="applyFilters"></button></div>';updateCount();
 }else{
 let a=matching();if(preview==='empty')a=[];
 let c=`${correction?`<div class="banner">Showing results for <strong>wallet</strong>. <button class="text" id="originalQuery">Search instead for “${esc(correction)}”</button></div>`:''}<div class="row"><div><h4 style="margin:8px 0">${queryText()?'Results for “'+esc(queryText())+'”':'All products'}</h4><span class="muted">${a.length} products</span></div><div class="actions"><button class="secondary" id="openFilters">Filter${activeCount()?' ('+activeCount()+')':''}</button><button class="secondary" id="openSort">${filters.sort==='featured'?'Featured':filters.sort==='priceAsc'?'Price ↑':filters.sort==='priceDesc'?'Price ↓':'Name'} ⌄</button></div></div>`;

 else c+=cards(a);$('content').innerHTML=c;announce(preview==='loading'?'Searching products':preview==='offline'?'You are offline':preview==='error'?'Products could not be loaded':a.length+' matching products');
 }
 bind();
